    <path stroke-width="16" stroke-linecap="round" d="M213 206H164c-9 0-13 5-12 14 6 50 28 92 72 116"/>
    <path stroke-width="18" stroke-linecap="butt" d="M213 199c0 92 16 150 33 194"/>
  </g>
  <use href="#ab-half" transform="matrix(-1 0 0 1 512 0)"/>

  <!-- Haste e base -->
  <path fill="url(#ab-gold)" d="M238 392h36c-3 26 0 46 28 62H210c28-16 31-36 28-62z"/>
  <path fill="url(#ab-gold)" d="M198 464h116c8 0 12 6 13 18H185c1-12 5-18 13-18z"/>

  <!-- Bolado -->
  <path fill="url(#ab-paper)" d="M228 176 L284 176 L266 392 L246 392 Z"/>
  <g clip-path="url(#ab-cone)" stroke="#6E4A2C" stroke-opacity=".35" stroke-width="2" fill="none">
    <path d="M222 216l70-22M222 256l70-22M222 296l70-22M222 336l70-22"/>
  </g>
  <path fill="#000" fill-opacity=".18" d="M270 176h14l-18 216h-6z"/>
  <path fill="url(#ab-gold)" d="M243.3 360h25.4L266 392h-20z"/>
  <!-- Ponta torcida com erva -->
  <path fill="#B48A5F" d="M226 178l6-10 6 6 6-9 6 7 6-8 6 7 6-8 6 8 6-6 6 9 2 4z"/>
  <g fill="#5F6B2E">
    <circle cx="238" cy="170" r="6"/><circle cx="250" cy="165" r="7"/><circle cx="263" cy="166" r="6.5"/><circle cx="274" cy="171" r="5.5"/>
  </g>
  <g fill="#8C9A45"><circle cx="245" cy="168" r="3"/><circle cx="258" cy="163" r="3"/><circle cx="269" cy="169" r="2.5"/></g>
</g>
  <text x="300" y="150" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="112" font-weight="600" fill="#F4EFE6" letter-spacing="-2">Avalie</text>
  <text x="300" y="262" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="112" font-weight="600" font-style="italic" fill="url(#ab-gold)" letter-spacing="-2">Bolados</text>

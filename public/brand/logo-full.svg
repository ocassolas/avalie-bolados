<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" role="img" aria-label="Avalie Bolados">
  <g transform="translate(0 -6) scale(.6)">
  <defs>
    <linearGradient id="ab-gold" x1="120" y1="40" x2="390" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBDD8F"/>
      <stop offset=".45" stop-color="#E9AE45"/>
      <stop offset="1" stop-color="#B97D1E"/>
    </linearGradient>
    <linearGradient id="ab-paper" x1="228" y1="0" x2="284" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8F6440"/>
      <stop offset=".45" stop-color="#C69A6D"/>
      <stop offset="1" stop-color="#94673F"/>
    </linearGradient>
    <clipPath id="ab-cone">
      <path d="M228 176 L284 176 L266 392 L246 392 Z"/>
    </clipPath>
  </defs>

  <!-- Fumaça -->
  <path fill="url(#ab-gold)" d="M268 22c20 28 12 48-5 68-15 18-21 33-8 54 3 5 2 8-3 9-22-20-26-40-11-63 13-20 28-36 27-68z"/>

  <!-- Troféu: lado esquerdo (o direito é espelhado) -->

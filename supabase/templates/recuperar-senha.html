<!-- Supabase → Authentication → Email Templates → Reset Password
     Assunto: Crie uma nova senha no Avalie Bolados -->
<div style="background:#0a0a0a;padding:40px 16px;font-family:Arial,Helvetica,sans-serif;color:#f4efe6">
  <div style="max-width:480px;margin:0 auto;background:#161512;border:1px solid #2a2722;border-radius:20px;padding:32px;text-align:center">
    <p style="margin:0;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#e9ae45">Avalie Bolados</p>
    <h1 style="margin:16px 0 8px;font-family:Georgia,serif;font-size:28px;color:#f4efe6">Nova senha</h1>
    <p style="margin:0 0 24px;color:#a39b8e;line-height:1.6">Recebemos um pedido para trocar sua senha. O link vale por 1 hora.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
       style="display:inline-block;background:linear-gradient(135deg,#fbdd8f,#e9ae45,#b97d1e);color:#1a1206;font-weight:bold;text-decoration:none;padding:14px 28px;border-radius:12px">
      Criar nova senha
    </a>
    <p style="margin:24px 0 0;font-size:12px;color:#6f685d">Não pediu? Ignore este e-mail: sua senha continua a mesma.</p>
  </div>
</div>
